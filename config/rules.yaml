# ルール分類（無料・オフライン）のキーワード. 上から順に評価し、最初に当たった分類を使う.
# 精度は LLM 分類より低い。「たたき台」として使い、人が直すか LLM 分類と比べる.
severity_defaults:      # 本文で決まらないときの重要度ごとの既定
  NITS: B1
  Q: C1
types:
  - {type: C1, any: ["？", "?", "でしょうか", "ですか", "確認させて", "教えて", "どの程度", "想定していますか"]}
  - {type: B1, any: ["誤字", "脱字", "表記", "体裁", "フォント", "インデント", "全角", "半角", "句読点", "typo", "スペル", "ゆれ"]}
  - {type: B3, any: ["対象外", "既に記載", "記載済み", "範囲外", "取り下げ"]}
  - {type: B2, any: ["した方が", "ほうが良い", "方がよい", "検討してはどうか", "あってもよい", "提案", "好み", "読みやすく"]}
  - {type: A1, any: ["記載が無い", "記載がない", "書かれていない", "定義されていない", "の記載が不足", "が無い", "がない"]}
  - {type: A2, any: ["誤り", "矛盾", "異なる", "一致しない", "食い違", "間違", "逆になって", "整合していない", "違反", "従っていない"]}
  - {type: A3, any: ["曖昧", "適宜", "不明確", "決まらない", "解釈", "など」", "等の", "明確に"]}
  - {type: A1, any: ["漏れ", "不足", "抜け", "無い", "ない。"]}
default_type: A1        # どれにも当たらない MUST / WANT
topics:                 # 観点のキーワード（工程の観点の一覧に無いものは使わない）
  画面・帳票: [画面, 帳票, 項目の配置, ボタン, 表示]
  API・IF: [API, IF, インタフェース, リクエスト, レスポンス, ステータス, 連携]
  バッチ: [バッチ, ジョブ, 終了コード, 取込, 再実行]
  データベース: [テーブル, インデックス, SQL, カラム, トランザクション, DB]
  メッセージ・エラー: [メッセージ, エラー, APPE, 例外]
  セキュリティ・権限: [認可, 認証, 権限, 個人情報, マスク, 他人]
  性能・非機能: [性能, 件数, タイムアウト, 応答時間, 上限, ページング]
  運用・監視: [監視, ログ, 運用, アラート, 障害]
  業務要件: [業務, 運用フロー, 業務フロー]
  機能要件: [機能一覧, 機能の, 機能要件]
  非機能要件: [非機能, 可用性, 性能要件]
  データ要件: [データ, 保持期間, 項目定義]
  外部連携: [外部, 他システム, 連携先]
  移行・運用: [移行, 切替, 旧システム]
  用語・前提: [用語, 前提, 定義]
  例外処理: [例外, エラー処理, catch, リトライ]
  可読性・保守性: [命名, 可読, 重複, 共通化, コメント]
  テスト: [テスト, assert, カバレッジ]
  設計との整合: [設計書, 仕様と]
  処理ロジック: [処理, 分岐, 条件]
  データアクセス: [Mapper, SQL, 検索条件]
  IF 項目: [項目, 桁, 型]
  共通部品: [共通, ユーティリティ]
root_causes:
  R4: [規約, 標準, ルール, 命名規則]
  R3: [他の設計書, 上位, 整合, 一覧と, 定義書と]
  R2: [前提, 境界, 例外ケース, 上限, タイムゾーン, 同時]
