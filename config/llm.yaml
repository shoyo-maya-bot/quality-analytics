# LLM による分類（任意・有料）. API キーは .env の ANTHROPIC_API_KEY（コミットしない）.
provider: anthropic
model: claude-haiku-4-5-20251001     # 分類は軽いモデルで十分。精度が足りなければ claude-sonnet-5-5
batch_size: 20                       # 1 回の呼び出しで分類する指摘の数
max_output_tokens: 4000
# 費用の上限（USD）. 見積もりがこれを超えると実行しない（--max-cost で上書き）
max_cost_usd: 5.0
# 見積もりに足す再試行の分の余裕（割合）. スキーマに合わない回答の再送・通信の再試行の分. 0.3 = 30%
# 実行中も実際の費用（API が返す usage）を数え、次の呼び出しで上限を超えそうなら残りを止める（終了コード 3）
retry_margin: 0.3
# 伏せ字は config/mask.yaml で設定する（取り込むときに伏せ、送る直前にも伏せ直す）.
# メールアドレス・電話番号は常に伏せる. ここの redact（正規表現）も互換のため引き続き使う
redact: []
# 呼び出しの再試行（429 / 5xx（529 を含む）/ 接続エラー. retry-after に従う）. 0 で再試行しない.
# 届いて処理された後に接続が切れた場合は、再送した分も課金されることがある
max_retries: 3
# 接続先は環境変数 ANTHROPIC_BASE_URL（社内ゲートウェイ等. 未設定なら https://api.anthropic.com）.
# 料金は devtools-common の共通の料金表（devtools_common.llm.PRICES）を使う. ここに pricing を書くと上書きになる（警告が出る. 非推奨）
