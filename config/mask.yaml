# 個人情報の伏せ字. collect で取り込むときにかけ、data/findings.csv には伏せた値だけを残す.
# LLM API に送る本文・Copilot 用の書き出し・レポート（report.md / dashboard.html / summary.xlsx）もすべて伏せた値になる.
#
# メールアドレス・電話番号は常に伏せる（全角・区切りなし・+81 も含む）. 設定では外せない.
# 区分の列（工程・重要度・判定・分類など）以外は、本文・対応内容・成果物名も含めてすべて伏せる対象.

# 氏名を U-xxxxxx（仮名）に置き換える列. 本文中の同じ氏名も同じ仮名になる.
# 氏名のまま集計したいときは [] にする（その場合も data/ と output/ は社外に出さない）
pseudonymize: [reviewer, author]

# 伏せる語（そのままの文字列）. 社名・顧客名・システム名・指摘表に出てくる氏名などを足す
words: []

# 伏せる正規表現（追加分）. 例: 社員番号 'EMP\d{6}'
patterns: []
