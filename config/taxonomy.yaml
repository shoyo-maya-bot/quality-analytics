# 指摘の分類（分類の正）. ルール分類・LLM 分類・Copilot 用プロンプトのすべてがこのファイルを使う.
# 分類を変えたら version を上げる（LLM 分類のキャッシュはこの version ごと）.
version: 1

groups:
  A: {name: 欠陥, description: 成果物の品質上の欠陥。直さないと後工程で不具合・手戻りになる}
  B: {name: ノイズ, description: 直しても品質への効果が小さい指摘。多すぎるとレビューの時間を奪う}
  C: {name: 確認, description: 質問・確認。回答によって A になることがある}

types:
  A1: {group: A, name: 記載漏れ, description: 書くべき仕様・条件・例外・値が書かれていない}
  A2: {group: A, name: 誤り・矛盾, description: 仕様の誤り、他の記述や他の成果物との矛盾}
  A3: {group: A, name: 曖昧, description: 解釈が複数ありうる。数値・条件・範囲が決まっていない}
  B1: {group: B, name: 表記・体裁, description: 誤字・表記ゆれ・書式・体裁}
  B2: {group: B, name: 好み・代案, description: 必須ではない書き方や設計の好み、代案の提示}
  B3: {group: B, name: 対象外・誤指摘, description: 範囲外、既に記載がある、指摘者の誤解}
  C1: {group: C, name: 質問・確認, description: 意図・前提の確認、情報の要求}

# 観点（工程ごと）. RD=要件定義 / BD=基本設計 / DD=詳細設計 / CD=製造（コード）
topics:
  RD: [業務要件, 機能要件, 非機能要件, データ要件, 外部連携, 移行・運用, 用語・前提]
  BD: [画面・帳票, API・IF, バッチ, データベース, メッセージ・エラー, セキュリティ・権限, 性能・非機能, 運用・監視]
  DD: [処理ロジック, データアクセス, 例外処理, IF 項目, 共通部品]
  CD: [設計との整合, 例外処理, 性能, セキュリティ, 可読性・保守性, テスト]

# 真因（A の指摘だけに付ける）. 「なぜ作成者が書けなかったか」
root_causes:
  R1: {name: 業務・要件の理解不足, description: 業務や要件を誤解・未理解のまま書いた}
  R2: {name: 前提・制約の確認漏れ, description: 前提条件・制約・例外ケースを確かめなかった}
  R3: {name: 他成果物との整合確認漏れ, description: 上位・関連の成果物と突き合わせなかった}
  R4: {name: 標準・規約の理解不足, description: 設計標準・記述ルールを知らない・守っていない}
  R5: {name: セルフチェック不足, description: 知っていたが確認しなかった（転記ミス・修正漏れ）}
  R6: {name: 記述の技術, description: 内容は分かっているが、伝わる書き方ができていない}
