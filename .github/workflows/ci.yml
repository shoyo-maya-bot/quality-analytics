name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  BANDIT_VERSION: "1.8.6"
  PIP_AUDIT_VERSION: "2.9.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Japanese fonts for charts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      - name: Install（constraints.txt があれば版を固定する）
        run: |
          c=(); if [ -f constraints.txt ]; then c=(-c constraints.txt); echo "constraints.txt を使います"; fi
          pip install -e ".[dev]" "${c[@]}"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: sample pipeline (rules only, no API calls)
        run: |
          python samples/make_samples.py
          qa collect table samples/指摘一覧.xlsx
          qa collect github --file samples/github_pulls.json
          qa collect office-review --reviews samples/office-review/reviews --history samples/office-review/history.jsonl
          qa classify --mode rules
          qa check
          qa classify --mode api --overwrite   # 見積もりだけ（--yes なしは送信しない）
          qa analyze
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sample-report
          path: output/

  # 利用者の多くは Windows。パス・改行・文字コードの違いで落ちないかを確かめる
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install（constraints.txt があれば版を固定する）
        run: |
          c=(); if [ -f constraints.txt ]; then c=(-c constraints.txt); echo "constraints.txt を使います"; fi
          pip install -e ".[dev]" "${c[@]}"
      - run: pytest -q

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the project
        run: |
          c=(); if [ -f constraints.txt ]; then c=(-c constraints.txt); fi
          pip install -e . "${c[@]}"
      - run: pip install "bandit==${BANDIT_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"
      - name: SAST (bandit)
        run: bandit -q -r src -ll
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --skip-editable --progress-spinner off
